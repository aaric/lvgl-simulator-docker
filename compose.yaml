services:
  lvgl-compile-server:
    image: ik8share/lvgl-compile-server:v261125b1
    container_name: lvgl-compile-server-single
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3001"
  lvgl-simulator:
    image: ik8share/lvgl-simulator:v261125b1
    container_name: lvgl-simulator-single
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "5173:5173"